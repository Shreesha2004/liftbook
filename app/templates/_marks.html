{# Shared SVG marks and icons. #}

{% macro circled(text) -%}
<span class="circled">{{ text }}<svg viewBox="0 0 120 40" preserveAspectRatio="none" aria-hidden="true"><path pathLength="1" d="M14 22C12 9 44 3 68 4c28 1 49 7 47 18-2 11-27 16-55 15C32 36 5 32 7 20 9 11 30 6 52 5"/></svg></span>
{%- endmacro %}

{% macro icon(name, class="h-4 w-4") -%}
<svg class="{{ class }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {%- if name == "plus" %}<path d="M12 5v14M5 12h14"/>
  {%- elif name == "minus" %}<path d="M5 12h14"/>
  {%- elif name == "x" %}<path d="M6 6l12 12M18 6L6 18"/>
  {%- elif name == "chevron" %}<path d="M6 9l6 6 6-6"/>
  {%- elif name == "check" %}<path d="M5 12.5l4.5 4.5L19 7.5"/>
  {%- endif %}
</svg>
{%- endmacro %}
