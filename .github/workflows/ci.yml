name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install ruff==0.16.10
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: workout_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workout_db
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/workout_test
      SECRET_KEY: ci-only-secret-key-that-is-long-enough
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"

      - name: Migrations apply cleanly and match the models
        run: |
          alembic upgrade head
          alembic check
      - name: Migrations roll back and re-apply
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Tests
        run: pytest --cov --cov-report=term --cov-fail-under=90

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t liftbook .
      - name: Smoke test the stack
        run: |
          docker compose up -d --build --wait
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:8000/healthz
          curl --fail -s http://localhost:8000/login | grep -q "demo account"
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v
